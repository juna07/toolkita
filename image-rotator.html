<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Putar Gambar Online Gratis | ToolKita</title><meta name="description" content="Putar gambar 90, 180, atau 270 derajat dan download hasilnya."><link rel="canonical" href="https://juna07.github.io/toolkita/image-rotator.html"><style>body{font:16px Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:18px}.nav a{color:#fff}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:12px}input,button{padding:10px;margin:6px 0}button{background:#153450;color:#fff;border:0;border-radius:7px}.out{margin-top:12px}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>Putar Gambar Online Gratis</h1><p>Pilih gambar, tentukan rotasi, lalu download hasilnya.</p><div class="card"><input id="file" type="file" accept="image/*"><select id="deg"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><br><button onclick="rotate()">Putar & Download</button><div id="out" class="out"></div></div></main><script>function rotate(){let f=file.files[0];if(!f)return;let im=new Image();im.onload=()=>{let d=+deg.value*Math.PI/180,c=document.createElement('canvas'),ctx=c.getContext('2d');if(deg.value==180){c.width=im.width;c.height=im.height}else{c.width=im.height;c.height=im.width}ctx.translate(c.width/2,c.height/2);ctx.rotate(d);ctx.drawImage(im,-im.width/2,-im.height/2);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rotated.jpg';a.click()},'image/jpeg',.9)};im.src=URL.createObjectURL(f)}</script></body></html>
