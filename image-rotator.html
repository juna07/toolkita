<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Putar Gambar Online Gratis | ToolKita</title><meta name="description" content="Putar gambar 90, 180, atau 270 derajat dan download hasilnya."><link rel="canonical" href="https://juna07.github.io/toolkita/image-rotator.html"><style>body{font:16px Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:18px}.nav a{color:#fff}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:12px}input,button{padding:10px;margin:6px 0}button{background:#153450;color:#fff;border:0;border-radius:7px}.out{margin-top:12px}</style></head><body data-tool="image-rotator"><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>Putar Gambar Online Gratis</h1><p>Pilih gambar, tentukan rotasi, lalu download hasilnya.</p><div class="card"><input id="file" type="file" accept="image/*"><select id="deg"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><br><button onclick="rotate()">Putar & Download</button><div id="out" class="out"></div></div></main><script>
function rotate() {
  const fileInput = document.getElementById('file');
  const degreeInput = document.getElementById('deg');
  const output = document.getElementById('out');
  const selected = fileInput.files && fileInput.files[0];
  if (!selected) { output.textContent = 'Pilih gambar terlebih dahulu.'; return; }
  if (!selected.type.startsWith('image/')) { output.textContent = 'File yang dipilih bukan gambar.'; return; }
  const sourceUrl = URL.createObjectURL(selected);
  const image = new Image();
  image.onerror = () => { URL.revokeObjectURL(sourceUrl); output.textContent = 'Gambar tidak dapat dibaca. Coba file lain.'; };
  image.onload = () => {
    const degrees = Number(degreeInput.value);
    const radians = degrees * Math.PI / 180;
    const canvas = document.createElement('canvas');
    const sideways = degrees === 90 || degrees === 270;
    canvas.width = sideways ? image.height : image.width;
    canvas.height = sideways ? image.width : image.height;
    const context = canvas.getContext('2d');
    if (!context) { URL.revokeObjectURL(sourceUrl); output.textContent = 'Browser tidak mendukung proses gambar.'; return; }
    context.translate(canvas.width / 2, canvas.height / 2);
    context.rotate(radians);
    context.drawImage(image, -image.width / 2, -image.height / 2);
    canvas.toBlob(blob => {
      URL.revokeObjectURL(sourceUrl);
      if (!blob) { output.textContent = 'Gagal membuat gambar hasil rotasi.'; return; }
      const resultUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = resultUrl;
      link.download = 'toolkita-rotated.jpg';
      link.click();
      setTimeout(() => URL.revokeObjectURL(resultUrl), 1000);
      output.textContent = 'Berhasil memutar gambar ' + degrees + '°. File JPG sudah diunduh.';
    }, 'image/jpeg', 0.92);
  };
  image.src = sourceUrl;
}
</script></body></html>
