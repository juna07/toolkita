<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kompres Gambar Online Gratis | ToolKita</title><meta name="description" content="Kompres gambar JPG dan PNG secara online gratis dengan mudah langsung dari browser."><link rel="canonical" href="https://juna07.github.io/toolkita/image-compressor.html"><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ef;color:#1b1f23}.nav{background:#153450;padding:18px 20px}.nav a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:800px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dad4c5;border-radius:10px;padding:24px}.field{margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input{width:100%}.btn{background:#ffb627;border:0;border-radius:6px;padding:12px 20px;font-weight:bold;cursor:pointer}.result{margin-top:18px}</style></head><body><nav class="nav"><a href="./">← ToolKita</a></nav><main class="wrap"><h1>Kompres Gambar Online Gratis</h1><p>Perkecil ukuran gambar langsung dari browser tanpa mengunggah file ke server.</p><div class="box"><input id="file" type="file" accept="image/jpeg,image/png"><div class="field"><label>Kualitas JPG: <span id="qv">70</span>%</label><input id="q" type="range" min="20" max="95" value="70"></div><button class="btn" id="go">Kompres Gambar</button><div id="result" class="result"></div></div><h2>Cara menggunakan</h2><p>Pilih gambar, atur kualitas, lalu klik Kompres. Hasil dapat disimpan sebagai JPG.</p></main><script>const f=document.getElementById('file'),q=document.getElementById('q'),qv=document.getElementById('qv');q.oninput=()=>qv.textContent=q.value;document.getElementById('go').onclick=()=>{if(!f.files[0]){document.getElementById('result').textContent='Pilih gambar terlebih dahulu.';return}const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const url=URL.createObjectURL(b);document.getElementById('result').innerHTML=`Ukuran asli: ${(f.files[0].size/1024).toFixed(1)} KB<br>Hasil: ${(b.size/1024).toFixed(1)} KB<br><a href="${url}" download="toolkita-compressed.jpg">Simpan gambar JPG</a>`},'image/jpeg',q.value/100)};img.src=URL.createObjectURL(f.files[0])}</script></body></html>
