<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator Online Gratis | ToolKita</title><meta name="description" content="Buat QR Code online gratis dari teks atau URL dengan QR Code Generator ToolKita."><link rel="canonical" href="https://juna07.github.io/toolkita/qr-code-generator.html"><style>body{font-family:Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:20px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:800px;margin:auto;padding:25px}.box{background:#fff;padding:24px;border-radius:12px;text-align:center}input{width:90%;padding:14px}button{padding:12px 18px;margin:10px}img{max-width:300px;margin:15px}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>QR Code Generator Online Gratis</h1><p>Buat QR Code dari URL atau teks dengan cepat.</p><div class="box"><input id="text" placeholder="https://contoh.com atau teks"><br><button onclick="buat()">Buat QR Code</button><div><img id="qr" alt="QR Code hasil" hidden></div></div><p>QR Code dibuat melalui layanan QR code berbasis web. Jangan masukkan data rahasia.</p></main><script>function buat(){let x=document.getElementById('text').value;if(!x)return;let q=document.getElementById('qr');q.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(x);q.hidden=false}</script></body></html>
