<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator BMI Online Gratis | ToolKita</title><meta name="description" content="Hitung BMI berdasarkan berat dan tinggi badan dengan kalkulator BMI online gratis ToolKita."><link rel="canonical" href="https://juna07.github.io/toolkita/bmi-calculator.html"><style>body{font-family:Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:20px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:800px;margin:auto;padding:25px}.box{background:#fff;padding:24px;border-radius:12px}input{display:block;padding:12px;margin:8px 0;width:90%}button{padding:12px 18px}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>Kalkulator BMI Online</h1><p>Hitung indeks massa tubuh (BMI) dari berat dan tinggi badan.</p><div class="box"><input id="w" type="number" placeholder="Berat (kg)"><input id="h" type="number" placeholder="Tinggi (cm)"><button onclick="calc()">Hitung BMI</button><h2 id="r">BMI: -</h2><p id="cat"></p></div><p><strong>Catatan:</strong> BMI adalah ukuran skrining umum dan bukan diagnosis medis.</p></main><script>function calc(){let w=+document.getElementById('w').value,h=+document.getElementById('h').value/100,b=w/(h*h);if(!w||!h||b<=0){r.textContent='BMI: input tidak valid';return}r.textContent='BMI: '+b.toFixed(1);cat.textContent=b<18.5?'Kategori: berat badan kurang':b<25?'Kategori: rentang normal':b<30?'Kategori: berat badan berlebih':'Kategori: obesitas'}</script></body></html>
