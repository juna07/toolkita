<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch Online Gratis | ToolKita</title><meta name="description" content="Gunakan stopwatch online gratis untuk mengukur waktu."><link rel="canonical" href="https://juna07.github.io/toolkita/stopwatch.html"><style>body{font:16px Arial;text-align:center;margin:0;background:#f7f5ef}.nav{background:#153450;padding:18px;text-align:left}.nav a{color:#fff}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:12px}.out{font-size:48px;padding:30px}button{padding:12px;margin:5px;background:#153450;color:#fff;border:0;border-radius:7px}</style></head><body><nav class="nav"><a href="./">← ToolKita</a></nav><main class="wrap"><h1>Stopwatch Online</h1><div class="card"><div id="out" class="out">0.0</div><button onclick="start()">Mulai</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button></div></main><script>let st=0,id;function start(){if(!id){st=Date.now()-(+out.textContent*1000);id=setInterval(()=>out.textContent=((Date.now()-st)/1000).toFixed(1),100)}}function stop(){clearInterval(id);id=null}function reset(){stop();out.textContent='0.0'}</script></body></html>
