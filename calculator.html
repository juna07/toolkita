<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Online Gratis | ToolKita</title><meta name="description" content="Kalkulator online gratis untuk menghitung operasi matematika dasar dengan cepat dan mudah."><link rel="canonical" href="https://juna07.github.io/toolkita/calculator.html"><style>body{font-family:Arial;margin:0;background:#f7f5ef;color:#17202a}.nav{background:#153450;padding:20px}.nav a{color:white;text-decoration:none}.wrap{max-width:800px;margin:auto;padding:25px}.box{background:white;padding:24px;border-radius:12px}input{width:100%;padding:14px;box-sizing:border-box;font-size:20px}button{padding:12px 18px;margin:5px;border:0;border-radius:8px;cursor:pointer}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>Kalkulator Online Gratis</h1><p>Hitung penjumlahan, pengurangan, perkalian, dan pembagian secara cepat.</p><div class="box"><input id="n" placeholder="Contoh: 125*8+50"><br><button onclick="hitung()">Hitung</button><button onclick="n.value=''">Reset</button><h2 id="hasil">Hasil: -</h2></div><h2>Cara menggunakan kalkulator</h2><p>Masukkan operasi matematika menggunakan angka dan simbol +, -, *, atau /. ToolKita menghitung hasil langsung di browser.</p></main><script>function hitung(){try{let x=document.getElementById('n').value;if(!/^[0-9+\-*/().%\s]+$/.test(x))throw 0;document.getElementById('hasil').textContent='Hasil: '+Function('return '+x)()}catch(e){document.getElementById('hasil').textContent='Hasil: input tidak valid'}}</script></body></html>
