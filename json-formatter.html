<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter Online Gratis | ToolKita</title><meta name="description" content="Format dan rapikan JSON secara online gratis dengan JSON Formatter ToolKita."><link rel="canonical" href="https://juna07.github.io/toolkita/json-formatter.html"><style>body{font-family:Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:20px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:auto;padding:25px}.box{background:#fff;padding:24px;border-radius:12px}textarea{width:100%;height:300px;padding:14px;box-sizing:border-box;font-family:monospace}button{padding:12px 18px;margin-top:10px}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>JSON Formatter Online</h1><p>Rapikan JSON agar lebih mudah dibaca dan cek apakah format JSON valid.</p><div class="box"><textarea id="t" placeholder='Contoh: {"nama":"ToolKita"}'></textarea><br><button onclick="fmt()">Format JSON</button><button onclick="min()">Minify</button><p id="r"></p></div><h2>JSON Formatter gratis</h2><p>Tempel JSON, lalu pilih Format untuk membuat struktur lebih mudah dibaca. Semua proses dilakukan di browser.</p></main><script>function fmt(){try{t.value=JSON.stringify(JSON.parse(t.value),null,2);r.textContent='JSON valid.'}catch(e){r.textContent='JSON tidak valid.'}}function min(){try{t.value=JSON.stringify(JSON.parse(t.value));r.textContent='JSON valid.'}catch(e){r.textContent='JSON tidak valid.'}}</script></body></html>
