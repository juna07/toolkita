<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Picker Online | ToolKita</title><meta name="description" content="Pilih warna online dan lihat nilai HEX RGB."><link rel="canonical" href="https://juna07.github.io/toolkita/color-picker.html"><style>body{font:16px Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:18px}.nav a{color:#fff}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:12px}.sw{width:100%;height:180px;border:0}.out{padding:12px;background:#eee}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>Color Picker Online</h1><div class="card"><input class="sw" id="c" type="color" value="#ff9900"><div id="out" class="out"></div></div></main><script>function f(){let h=c.value,n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;out.textContent=`HEX: ${h} | RGB: rgb(${r}, ${g}, ${b})`}c.oninput=f;f()</script></body></html>
