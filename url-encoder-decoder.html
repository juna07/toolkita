<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder Decoder Online | ToolKita</title><meta name="description" content="Encode dan decode URL atau teks secara online gratis dengan URL Encoder Decoder ToolKita."><link rel="canonical" href="https://juna07.github.io/toolkita/url-encoder-decoder.html"><style>body{font-family:Arial;margin:0;background:#f7f5ef}.nav{background:#153450;padding:20px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:auto;padding:25px}.box{background:#fff;padding:24px;border-radius:12px}textarea{width:100%;height:220px;padding:14px;box-sizing:border-box}button{padding:12px;margin:5px}</style></head><body><nav class="nav"><div class="wrap"><a href="./">← ToolKita</a></div></nav><main class="wrap"><h1>URL Encoder Decoder Online</h1><p>Encode atau decode URL dan teks dengan mudah langsung di browser.</p><div class="box"><textarea id="t" placeholder="Masukkan URL atau teks..."></textarea><br><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button><button onclick="t.value=''">Reset</button></div><h2>Apa itu URL encoding?</h2><p>URL encoding mengubah karakter tertentu menjadi format yang aman digunakan dalam URL.</p></main><script>function enc(){t.value=encodeURIComponent(t.value)}function dec(){try{t.value=decodeURIComponent(t.value)}catch(e){alert('Format tidak valid')}}</script></body></html>
