<style>
:root{
  --paper:#F7F5EF;
  --ink:#1B1F23;
  --navy:#153450;
  --navy-2:#0F2740;
  --amber:#FFB627;
  --teal:#0E7C7B;
  --line:#DAD4C5;
  --danger:#C1432E;
  --card:#FFFFFF;
  --radius:10px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation:none !important; transition:none !important;} }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif; line-height:1.5;
}
h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; }
.mono{ font-family:'IBM Plex Mono', monospace; }
a{ color:var(--teal); }
button, input, select, textarea{ font-family:inherit; font-size:1rem; }
:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }

.wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }

/* ---- NAV ---- */
.nav{
  position:sticky; top:0; z-index:40; background:var(--navy);
  border-bottom:3px solid var(--amber);
}
.nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:64px; }
.logo{ color:#fff; font-weight:700; font-size:1.3rem; text-decoration:none; letter-spacing:0.5px; }
.logo span{ color:var(--amber); }
.navlinks{ display:flex; gap:22px; align-items:center; }
.navlinks a{ color:#EDE9DD; text-decoration:none; font-weight:500; font-size:0.95rem; }
.navlinks a:hover{ color:var(--amber); }

/* ---- HERO ---- */
.hero{ background:var(--navy); color:#fff; padding:56px 0 70px; position:relative; }
.hero .wrap{ position:relative; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; margin:0 0 10px; }
.hero h1{ font-size:2.4rem; margin:0 0 12px; max-width:640px; line-height:1.15; }
.hero p{ color:#C9D3DC; max-width:520px; margin:0 0 28px; font-size:1.05rem; }
.searchbox{ display:flex; gap:0; max-width:520px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
.searchbox input{ flex:1; border:none; padding:15px 16px; font-size:1rem; outline:none; }
.searchbox .icon{ display:flex; align-items:center; padding:0 16px; color:var(--navy); font-weight:600; }

/* ---- SECTIONS ---- */
section.block{ padding:44px 0; }
.section-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
.section-head .tag{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--teal); background:rgba(14,124,123,0.1); padding:3px 8px; border-radius:4px; letter-spacing:1px; }
.section-head h2{ font-size:1.4rem; margin:0; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }

/* Tool card — pegboard tag signature */
.card{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 18px 18px; text-decoration:none; color:var(--ink); display:block;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:before{
  content:''; position:absolute; top:14px; left:14px; width:8px; height:8px; border-radius:50%;
  background:var(--paper); border:1px solid var(--line); box-shadow:inset 0 0 0 1px var(--paper);
}
.card:hover{ transform:translateY(-3px); box-shadow:0 10px 22px rgba(21,52,80,0.12); border-color:var(--teal); }
.card .code{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--teal); display:block; margin-bottom:10px; padding-left:16px; letter-spacing:1px; }
.card .icon{ font-size:1.6rem; margin-bottom:8px; }
.card h3{ margin:0 0 6px; font-size:1.05rem; }
.card p{ margin:0; font-size:0.88rem; color:#5b6470; }
.card.hidden{ display:none; }

.chips{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
.chip{
  font-family:'IBM Plex Mono',monospace; font-size:0.8rem; padding:8px 14px; border-radius:999px;
  border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);
}
.chip.active, .chip:hover{ background:var(--navy); color:#fff; border-color:var(--navy); }

/* ---- TOOL VIEW ---- */
.toolhead{ display:flex; align-items:center; gap:14px; margin-bottom:8px; }
.back{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--teal); font-weight:600; font-size:0.9rem; }
.toolbox{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px;
  margin-top:18px;
}
.field{ margin-bottom:16px; }
.field label{ display:block; font-weight:600; font-size:0.9rem; margin-bottom:6px; }
.field .hint{ font-size:0.8rem; color:#5b6470; margin-top:4px; }
input[type=text], input[type=number], input[type=url], select, textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
}
textarea{ resize:vertical; min-height:80px; }
input[type=file]{ width:100%; padding:11px 0; }
.row{ display:flex; gap:14px; flex-wrap:wrap; }
.row .field{ flex:1; min-width:160px; }
.btn{
  display:inline-flex; align-items:center; gap:8px; background:var(--amber); color:var(--navy-2);
  border:none; padding:12px 22px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.95rem;
}
.btn:hover{ filter:brightness(1.05); }
.btn.secondary{ background:transparent; color:var(--navy); border:1.5px solid var(--navy); }
.btn.small{ padding:8px 14px; font-size:0.85rem; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }
.result{ margin-top:20px; padding-top:20px; border-top:1px dashed var(--line); }
.thumbs{ display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
.thumb{ border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; width:140px; text-align:center; }
.thumb img{ max-width:100%; border-radius:4px; display:block; margin-bottom:6px; }
.stat-row{ display:flex; gap:24px; flex-wrap:wrap; margin-top:14px; }
.stat{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 18px; min-width:140px; }
.stat .num{ font-family:'IBM Plex Mono',monospace; font-size:1.3rem; font-weight:600; color:var(--navy); display:block; }
.stat .lbl{ font-size:0.78rem; color:#5b6470; }
.itemrow{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.itemrow input{ flex:1; }
.itemrow input.qty, .itemrow input.price{ max-width:110px; }
.remove-x{ background:none; border:none; color:var(--danger); font-size:1.2rem; cursor:pointer; padding:4px 8px; }
.captionCard{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; font-size:0.95rem; white-space:pre-wrap; }
.copy-btn{ font-size:0.78rem; margin-top:8px; }
#qrbox{ display:flex; justify-content:center; padding:20px; background:#fff; border:1px dashed var(--line); border-radius:8px; margin-top:14px; }
.empty{ font-size:0.9rem; color:#5b6470; }

footer{ background:var(--navy-2); color:#B9C3CC; padding:30px 0; margin-top:40px; }
footer .wrap{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:0.85rem; }
footer a{ color:#DCE3E8; text-decoration:none; margin-left:16px; }
footer a:hover{ color:var(--amber); }

.ad-slot{
  border:1.5px dashed var(--line); border-radius:8px; padding:22px; text-align:center; color:#8a8f97;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,0.015), rgba(0,0,0,0.015) 10px, transparent 10px, transparent 20px);
  margin:32px 0; font-size:0.85rem;
}
.ad-slot .ad-label{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:2px; color:#a8adb4; display:block; margin-bottom:6px; }

.blog-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; text-decoration:none; color:var(--ink); display:block; }
.blog-card:hover{ border-color:var(--teal); }
.blog-card .cat{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--teal); }
.blog-card h3{ margin:8px 0 6px; font-size:1.05rem; }
.blog-card p{ margin:0; font-size:0.88rem; color:#5b6470; }

article.post .meta{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--teal); margin-bottom:6px; }

.infopage ul{ line-height:1.8; }

@media (max-width:640px){

  .navlinks{ gap:12px; }
  .navlinks a{ font-size:0.85rem; }
  footer .wrap{ flex-direction:column; }
  footer a{ margin-left:0; margin-right:16px; }
}
</style>

function initHome(){
  const search = document.getElementById('searchInput');
  const cards = () => Array.from(document.querySelectorAll('#toolsGrid .card'));
  const emptyMsg = document.getElementById('emptyMsg');
  let activeCat = 'all';

  function applyFilter(){
    const q = (search.value || '').trim().toLowerCase();
    let visibleCount = 0;
    cards().forEach(c=>{
      const matchesText = !q || c.dataset.title.includes(q) || c.dataset.desc.includes(q);
      const matchesCat = activeCat === 'all' || c.dataset.cat === activeCat;
      const show = matchesText && matchesCat;
      c.classList.toggle('hidden', !show);
      if(show) visibleCount++;
    });
    emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
  }

  search.addEventListener('input', applyFilter);
  document.querySelectorAll('#catChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      applyFilter();
      document.getElementById('all-tools').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function fmtBytes(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function fmtRupiah(n){
  if(isNaN(n)) return 'Rp0';
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}

function jpg2pdfHTML(t){
  return toolShell(t, `
    <div class="field">

      <input type="file" id="jp-files" accept="image/*" multiple>
      <p class="hint">Urutan file = urutan halaman PDF.</p>
    </div>
    <div class="thumbs" id="jp-thumbs"></div>
    <button class="btn" id="jp-make" disabled style="margin-top:16px;">Buat PDF</button>
    <div class="result" id="jp-result" style="display:none;"></div>
  `);

function initJpg2Pdf(){
  const input = document.getElementById('jp-files');
  const thumbs = document.getElementById('jp-thumbs');
  const makeBtn = document.getElementById('jp-make');
  const result = document.getElementById('jp-result');
  let files = [];

  input.addEventListener('change', e=>{
    files = Array.from(e.target.files);
    thumbs.innerHTML = '';
    files.forEach(f=>{
      const url = URL.createObjectURL(f);
      const div = document.createElement('div');
      div.className = 'thumb';
      div.innerHTML = `<img src="${url}" alt="${f.name}"><span style="font-size:0.72rem;">${f.name}</span>`;
      thumbs.appendChild(div);
    });
    makeBtn.disabled = files.length === 0;
    result.style.display = 'none';
  });

  makeBtn.addEventListener('click', async ()=>{
    if(!files.length) return;
    makeBtn.disabled = true;
    makeBtn.textContent = 'Memproses...';
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 24;

    for (let i=0; i<files.length; i++){
      const dataUrl = await new Promise(res=>{
        const reader = new FileReader();
        reader.onload = ()=>res(reader.result);
        reader.readAsDataURL(files[i]);
      });
      const img = await new Promise(res=>{
        const im = new Image();
        im.onload = ()=>res(im);
        im.src = dataUrl;
      });
      const maxW = pageW - margin*2;
      const maxH = pageH - margin*2;
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW/w, maxH/h);
      w = w*ratio; h = h*ratio;
      const x = (pageW - w)/2, y = (pageH - h)/2;
      if(i>0) pdf.addPage();
      const fmt = files[i].type.includes('png') ? 'PNG' : 'JPEG';
      pdf.addImage(dataUrl, fmt, x, y, w, h);
    }
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    result.style.display = 'block';
    result.innerHTML = `<p>PDF siap, ${files.length} halaman.</p><a class="btn" href="${url}" download="toolkita-gabungan.pdf">Download PDF</a>`;
    makeBtn.disabled = false;
    makeBtn.textContent = 'Buat PDF';
  });
}

function initPdf2Jpg(){

  const result = document.getElementById('pj-result');
  const thumbs = document.getElementById('pj-thumbs');
  const zipBtn = document.getElementById('pj-zip');
  let pageBlobs = [];

  input.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    thumbs.innerHTML = '<p class="empty">Memproses halaman...</p>';
    result.style.display = 'block';

      canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;

      zip.file(p.name, base64, {base64:true});
    });
    const content = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url; a.download = 'toolkita-halaman.zip'; a.click();
  });

function initCompressImg(){
  const fileInput = document.getElementById('ci-file');
  const quality = document.getElementById('ci-quality');
  const qval = document.getElementById('ci-qval');
  const result = document.getElementById('ci-result');
  const beforeStat = document.getElementById('ci-before');
  const afterStat = document.getElementById('ci-after');
  const dlBtn = document.getElementById('ci-download');
  let img = null, originalSize = 0;

  function process(){
    if(!img) return;
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const q = Number(quality.value)/100;
    const dataUrl = canvas.toDataURL('image/jpeg', q);
    const approxBytes = Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75);
    beforeStat.textContent = fmtBytes(originalSize);
    afterStat.textContent = fmtBytes(approxBytes);
    dlBtn.href = dataUrl;
    result.style.display = 'block';
  }

  quality.addEventListener('input', ()=>{ qval.textContent = quality.value; process(); });
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    originalSize = file.size;
    const reader = new FileReader();
    reader.onload = ()=>{
      img = new Image();
      img.onload = process;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function initResizeImg(){
  const fileInput = document.getElementById('ri-file');
  const wInput = document.getElementById('ri-w');
  const hInput = document.getElementById('ri-h');
  const lock = document.getElementById('ri-lock');
  const result = document.getElementById('ri-result');
  const preview = document.getElementById('ri-preview');
  const dlBtn = document.getElementById('ri-download');
  let img = null, ratio = 1;

  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      img = new Image();
      img.onload = ()=>{
        ratio = img.width / img.height;
        wInput.value = img.width;
        hInput.value = img.height;
        renderResize();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  wInput.addEventListener('input', ()=>{
    if(lock.checked && img) hInput.value = Math.round(Number(wInput.value) / ratio);
    renderResize();
  });
  hInput.addEventListener('input', ()=>{
    if(lock.checked && img) wInput.value = Math.round(Number(hInput.value) * ratio);
    renderResize();
  });

  function renderResize(){
    if(!img || !wInput.value || !hInput.value) return;
    const canvas = document.createElement('canvas');
    canvas.width = Number(wInput.value);
    canvas.height = Number(hInput.value);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    preview.src = dataUrl;
    dlBtn.href = dataUrl;
    result.style.display = 'block';
  }
}

const NAME_PREFIX = {

const NAME_SUFFIX = ['Jaya','Nusantara','Kita','Sejahtera','Prima','id','Bersama','Mandiri','Cipta','Utama'];

  const keyword = document.getElementById('gn-keyword');
  const cat = document.getElementById('gn-cat');
  const makeBtn = document.getElementById('gn-make');
  const result = document.getElementById('gn-result');
  function pick(arr,n){ const c=[...arr]; const out=[]; while(out.length<n && c.length){ out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return out; }
  makeBtn.addEventListener('click', ()=>{
    const kw = keyword.value.trim() || 'Usaha';
    const kwCap = kw.charAt(0).toUpperCase()+kw.slice(1);
    const prefixes = NAME_PREFIX[cat.value];
    const names = new Set();
    while(names.size < 8){
      const usePrefix = Math.random() > 0.35;
      const p = pick(prefixes,1)[0];
      const s = pick(NAME_SUFFIX,1)[0];
      if(usePrefix) names.add(`${p} ${kwCap}`);
      else names.add(`${kwCap} ${s}`);
    }
    result.style.display = 'block';
    result.innerHTML = `<div class="grid">${[...names].map(n=>`<div class="captionCard" style="margin:0;">${n}</div>`).join('')}</div>`;
  });
}

/* ================= Angka ke Terbilang (dipakai juga di Kwitansi) ================= */
const SATUAN = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function terbilang(n){
  n = Math.floor(Math.abs(n));
  if(n < 12) return SATUAN[n];
  if(n < 20) return terbilang(n-10) + ' belas';
  if(n < 100) return terbilang(Math.floor(n/10)) + ' puluh ' + terbilang(n%10);
  if(n < 200) return 'seratus ' + terbilang(n-100);
  if(n < 1000) return terbilang(Math.floor(n/100)) + ' ratus ' + terbilang(n%100);
  if(n < 2000) return 'seribu ' + terbilang(n-1000);
  if(n < 1000000) return terbilang(Math.floor(n/1000)) + ' ribu ' + terbilang(n%1000);
  if(n < 1000000000) return terbilang(Math.floor(n/1000000)) + ' juta ' + terbilang(n%1000000);
  if(n < 1000000000000) return terbilang(Math.floor(n/1000000000)) + ' miliar ' + terbilang(n%1000000000);
  return terbilang(Math.floor(n/1000000000000)) + ' triliun ' + terbilang(n%1000000000000);
}
function terbilangClean(n){
  return terbilang(n).replace(/\s+/g,' ').trim().replace(/^./, c=>c.toUpperCase());
}

function initCropImg(){
  const fileInput = document.getElementById('cr-file');
  const xI=document.getElementById('cr-x'), yI=document.getElementById('cr-y'), wI=document.getElementById('cr-w'), hI=document.getElementById('cr-h');
  const hint = document.getElementById('cr-hint');
  const result = document.getElementById('cr-result');
  const preview = document.getElementById('cr-preview');
  const dlBtn = document.getElementById('cr-download');
  let img = null;
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      img = new Image();
      img.onload = ()=>{
        hint.textContent = `Ukuran asli: ${img.width} x ${img.height}px`;
        wI.value = img.width; hI.value = img.height;
        doCrop();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  function doCrop(){
    if(!img) return;
    const x = Number(xI.value)||0, y = Number(yI.value)||0;
    const w = Math.min(Number(wI.value)||1, img.width-x);
    const h = Math.min(Number(hI.value)||1, img.height-y);
    if(w<=0 || h<=0) return;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    preview.src = dataUrl;
    dlBtn.href = dataUrl;
    result.style.display = 'block';
  }
  [xI,yI,wI,hI].forEach(el=>el.addEventListener('input', doCrop));
}

    </div>
    <div class="result" id="rt-result" style="display:none; margin-top:16px;">
      <img id="rt-preview" style="max-width:260px; border:1px solid var(--line); border-radius:8px;">

function initRotateImg(){
  const fileInput = document.getElementById('rt-file');
  const preview = document.getElementById('rt-preview');
  const result = document.getElementById('rt-result');
  const dlBtn = document.getElementById('rt-download');
  let img = null, rotation = 0, flipH = false, flipV = false;
  function draw(){
    if(!img) return;
    const canvas = document.createElement('canvas');
    const swap = rotation % 180 !== 0;
    canvas.width = swap ? img.height : img.width;
    canvas.height = swap ? img.width : img.height;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(rotation * Math.PI/180);
    ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    preview.src = dataUrl;
    dlBtn.href = dataUrl;
    result.style.display = 'block';
  }
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    rotation = 0; flipH = false; flipV = false;
    const reader = new FileReader();
    reader.onload = ()=>{ img = new Image(); img.onload = draw; img.src = reader.result; };
    reader.readAsDataURL(file);
  });
  document.getElementById('rt-rotate').addEventListener('click', ()=>{ rotation = (rotation+90)%360; draw(); });
  document.getElementById('rt-fliph').addEventListener('click', ()=>{ flipH = !flipH; draw(); });
  document.getElementById('rt-flipv').addEventListener('click', ()=>{ flipV = !flipV; draw(); });
}

  function calc(){
    const f=Number(fixed.value)||0, p=Number(price.value)||0, v=Number(varc.value)||0;
    const margin = p - v;
    if(margin<=0){ unitOut.textContent='—'; rpOut.textContent='Harga jual harus lebih besar dari biaya variabel'; return; }
    const units = f/margin;
    unitOut.textContent = Math.ceil(units).toLocaleString('id-ID');

  }

}

  const upper=document.getElementById('gp-upper'), lower=document.getElementById('gp-lower'), num=document.getElementById('gp-num'), sym=document.getElementById('gp-sym');
  const makeBtn=document.getElementById('gp-make'), result=document.getElementById('gp-result'), output=document.getElementById('gp-output'), copyBtn=document.getElementById('gp-copy');
  length.addEventListener('input', ()=>lval.textContent=length.value);
  makeBtn.addEventListener('click', ()=>{
    let chars = '';
    if(upper.checked) chars += 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    if(lower.checked) chars += 'abcdefghijkmnpqrstuvwxyz';
    if(num.checked) chars += '23456789';
    if(sym.checked) chars += '!@#$%^&*-_=+';
    if(!chars){ chars = 'abcdefghijkmnpqrstuvwxyz23456789'; }
    const len = Number(length.value);
    const rand = new Uint32Array(len);
    crypto.getRandomValues(rand);
    let pass = '';
    for(let i=0;i<len;i++){ pass += chars[rand[i] % chars.length]; }
    output.textContent = pass;
    result.style.display = 'block';
  });
  copyBtn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(output.textContent);
    copyBtn.textContent='Tersalin!'; setTimeout(()=>copyBtn.textContent='Salin Password',1500);
  });
}

  return toolShell(t, `

function initUnitConverter(units, prefix){
  const val=document.getElementById(`${prefix}-val`), from=document.getElementById(`${prefix}-from`), to=document.getElementById(`${prefix}-to`);
  const out=document.getElementById(`${prefix}-out`);
  function calc(){
    const v = Number(val.value)||0;
    const base = v * units[from.value];
    const result = base / units[to.value];
    out.textContent = result.toLocaleString('id-ID', {maximumFractionDigits:6}) + ' ' + to.value;
  }
  [val,from,to].forEach(el=>el.addEventListener('input', calc));
  calc();
}

  const cOut=document.getElementById('su-c'), fOut=document.getElementById('su-f'), kOut=document.getElementById('su-k'), rOut=document.getElementById('su-r');
  function calc(){
    const v = Number(val.value)||0;
    let celsius;
    if(from.value==='c') celsius = v;
    else if(from.value==='f') celsius = (v-32)*5/9;
    else if(from.value==='k') celsius = v-273.15;
    else celsius = v*5/4;
    cOut.textContent = celsius.toFixed(2)+'°C';
    fOut.textContent = (celsius*9/5+32).toFixed(2)+'°F';
    kOut.textContent = (celsius+273.15).toFixed(2)+'K';
    rOut.textContent = (celsius*4/5).toFixed(2)+'°R';
  }
  [val,from].forEach(el=>el.addEventListener('input', calc));
  calc();
}

/* ================= Konversi Zona Waktu ================= */
const TIMEZONES = {WIB:7, WITA:8, WIT:9, London:0, Tokyo:9, 'New York':-5, Sydney:10};
function convWaktuHTML(t){
  const zones = Object.keys(TIMEZONES);
  return toolShell(t, `
    <div class="row">
      <div class="field"><label for="wk-jam">Jam (HH:MM)</label><input type="text" id="wk-jam" placeholder="14:30"></div>
      <div class="field"><label for="wk-from">Zona asal</label><select id="wk-from">${zones.map(z=>`<option>${z}</option>`).join('')}</select></div>
      <div class="field"><label for="wk-to">Zona tujuan</label><select id="wk-to">${zones.map((z,i)=>`<option ${i===1?'selected':''}>${z}</option>`).join('')}</select></div>
    </div>
    <p class="hint">Pakai selisih UTC standar, belum memperhitungkan waktu musim panas (DST) di luar Indonesia.</p>
    <div class="result">
      <div class="stat"><span class="num" id="wk-out">-</span><span class="lbl">Jam di zona tujuan</span></div>
    </div>
  `);
}
function initConvWaktu(){
  const jam=document.getElementById('wk-jam'), from=document.getElementById('wk-from'), to=document.getElementById('wk-to'), out=document.getElementById('wk-out');
  function calc(){
    const m = jam.value.match(/^(\d{1,2}):(\d{2})$/);
    if(!m){ out.textContent='Format jam salah'; return; }
    let h = Number(m[1]), min = Number(m[2]);
    const diff = TIMEZONES[to.value] - TIMEZONES[from.value];
    let total = h*60+min + diff*60;
    total = ((total % 1440) + 1440) % 1440;
    const outH = Math.floor(total/60), outM = total%60;
    out.textContent = `${String(outH).padStart(2,'0')}:${String(outM).padStart(2,'0')} ${to.value}`;
  }
  [jam,from,to].forEach(el=>el.addEventListener('input', calc));
}

  const input=document.getElementById('pc-input'), label=document.getElementById('pc-label'), tips=document.getElementById('pc-tips');
  function calc(){
    const p = input.value;
    let score = 0;
    const checks = [
      {ok: p.length>=8, msg:'Minimal 8 karakter'},
      {ok: p.length>=12, msg:'Lebih aman kalau 12+ karakter'},
      {ok: /[A-Z]/.test(p), msg:'Ada huruf besar'},
      {ok: /[a-z]/.test(p), msg:'Ada huruf kecil'},
      {ok: /[0-9]/.test(p), msg:'Ada angka'},
      {ok: /[^A-Za-z0-9]/.test(p), msg:'Ada simbol'},
    ];
    score = checks.filter(c=>c.ok).length;
    const labels = ['Sangat Lemah','Lemah','Cukup','Kuat','Sangat Kuat','Sangat Kuat'];
    label.textContent = p ? labels[Math.min(score,5)] : '-';
    tips.innerHTML = checks.filter(c=>!c.ok).map(c=>`<li>${c.msg}</li>`).join('') || (p ? '<li>Password ini sudah cukup baik 👍</li>' : '');
  }
  input.addEventListener('input', calc);
}

function initCalcUmur(){
  const input=document.getElementById('um-tanggal'), result=document.getElementById('um-result');
  const umur=document.getElementById('um-umur'), hari=document.getElementById('um-hari'), ultah=document.getElementById('um-ultah');
  input.addEventListener('change', ()=>{
    if(!input.value) return;
    const lahir = new Date(input.value);
    const now = new Date();
    let years = now.getFullYear()-lahir.getFullYear();
    let months = now.getMonth()-lahir.getMonth();
    let days = now.getDate()-lahir.getDate();
    if(days<0){ months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if(months<0){ years--; months += 12; }
    umur.textContent = `${years} th ${months} bln ${days} hr`;
    hari.textContent = Math.floor((now-lahir)/(1000*60*60*24)).toLocaleString('id-ID') + ' hari';
    let nextBday = new Date(now.getFullYear(), lahir.getMonth(), lahir.getDate());
    if(nextBday < now) nextBday.setFullYear(now.getFullYear()+1);
    ultah.textContent = Math.ceil((nextBday-now)/(1000*60*60*24)) + ' hari lagi';
    result.style.display = 'block';
  });
}

    </div>

      <div class="row">
        <div class="field"><label for="tm-min">Menit</label><input type="number" id="tm-min" value="5" min="0"></div>
        <div class="field"><label for="tm-sec">Detik</label><input type="number" id="tm-sec" value="0" min="0" max="59"></div>
      </div>
      <div class="captionCard mono" id="tm-display" style="font-size:2rem; text-align:center;">05:00</div>
      <div class="row" style="margin-top:14px; justify-content:center;">
        <button class="btn" id="tm-start">Mulai</button>
        <button class="btn secondary" id="tm-stop">Jeda</button>

function initStopwatch(){
  document.querySelectorAll('.chip[data-tab]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip[data-tab]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      document.getElementById('sw-panel').style.display = chip.dataset.tab==='sw' ? 'block':'none';
      document.getElementById('tm-panel').style.display = chip.dataset.tab==='tm' ? 'block':'none';
    });
  });

  let swInterval=null, swElapsed=0, swStart=0;
  const swDisplay=document.getElementById('sw-display');
  function swRender(){
    const ms = swElapsed;
    const m = Math.floor(ms/60000);
    const s = Math.floor((ms%60000)/1000);
    const d = Math.floor((ms%1000)/100);
    swDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`;
  }
  document.getElementById('sw-start').addEventListener('click', ()=>{
    if(swInterval) return;
    swStart = Date.now() - swElapsed;
    swInterval = setInterval(()=>{ swElapsed = Date.now()-swStart; swRender(); }, 100);
  });
  document.getElementById('sw-stop').addEventListener('click', ()=>{ clearInterval(swInterval); swInterval=null; });
  document.getElementById('sw-reset').addEventListener('click', ()=>{ clearInterval(swInterval); swInterval=null; swElapsed=0; swRender(); });

  let tmInterval=null, tmRemaining=0;
  const tmDisplay=document.getElementById('tm-display'), tmMsg=document.getElementById('tm-msg');
  const tmMin=document.getElementById('tm-min'), tmSec=document.getElementById('tm-sec');
  function tmRender(){
    const m = Math.floor(tmRemaining/60), s = tmRemaining%60;
    tmDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function tmSyncFromInputs(){ tmRemaining = (Number(tmMin.value)||0)*60 + (Number(tmSec.value)||0); tmRender(); }
  tmMin.addEventListener('input', tmSyncFromInputs);
  tmSec.addEventListener('input', tmSyncFromInputs);
  tmSyncFromInputs();
  document.getElementById('tm-start').addEventListener('click', ()=>{
    if(tmInterval) return;
    if(tmRemaining<=0) tmSyncFromInputs();
    tmMsg.textContent = '';
    tmInterval = setInterval(()=>{
      tmRemaining--;
      if(tmRemaining<=0){
        tmRemaining=0; tmRender(); clearInterval(tmInterval); tmInterval=null;
        tmMsg.textContent = "Waktu habis! ⏰";
        return;
      }
      tmRender();
    }, 1000);
  });
  document.getElementById('tm-stop').addEventListener('click', ()=>{ clearInterval(tmInterval); tmInterval=null; });
  document.getElementById('tm-reset').addEventListener('click', ()=>{ clearInterval(tmInterval); tmInterval=null; tmMsg.textContent=''; tmSyncFromInputs(); });
}

function navHTML(){
  return `
  <nav class="nav">
    <div class="wrap">
      <a class="logo" href="#home">TOOL<span>KITA</span></a>
      <div class="navlinks">
        <a href="#home">Home</a>
        <a href="#all-tools" onclick="location.hash='home'; setTimeout(()=>document.getElementById('all-tools').scrollIntoView({behavior:'smooth'}),50); return false;">Tools</a>
        <a href="#blog">Blog</a>
      </div>
    </div>
  </nav>`;
}

function footerHTML(){
  return `
  <footer>
    <div class="wrap">
      <div>© 2026 Toolkita. Dibuat untuk bantu kerja harian jadi lebih ringan.</div>
      <div>
        <a href="#about">Tentang</a>
        <a href="#contact">Kontak</a>
        <a href="#privacy">Kebijakan Privasi</a>
        <a href="#terms">Syarat Penggunaan</a>
      </div>
    </div>
  </footer>`;
}

function render(){
  const hash = (location.hash || '#home').replace('#','');
  if(hash === 'home' || hash === '' || hash === 'all-tools'){
    APP.innerHTML = navHTML() + homeHTML() + footerHTML();
    initHome();
    if(hash === 'all-tools'){
      setTimeout(()=>document.getElementById('all-tools').scrollIntoView({block:'start'}), 30);
    }
    return;
  }
  if(hash === 'blog'){
    APP.innerHTML = navHTML() + blogListHTML() + footerHTML();
    window.scrollTo(0,0);
    return;
  }
  if(hash.startsWith('blog-')){
    APP.innerHTML = navHTML() + blogPostHTML(hash.replace('blog-','')) + footerHTML();
    window.scrollTo(0,0);
    return;
  }
  if(hash === 'about'){ APP.innerHTML = navHTML() + aboutHTML() + footerHTML(); window.scrollTo(0,0); return; }
  if(hash === 'contact'){ APP.innerHTML = navHTML() + contactHTML() + footerHTML(); window.scrollTo(0,0); return; }
  if(hash === 'privacy'){ APP.innerHTML = navHTML() + privacyHTML() + footerHTML(); window.scrollTo(0,0); return; }
  if(hash === 'terms'){ APP.innerHTML = navHTML() + termsHTML() + footerHTML(); window.scrollTo(0,0); return; }

  const tool = toolById(hash);
  if(!tool || !TOOL_RENDERERS[hash]){
    APP.innerHTML = navHTML() + homeHTML() + footerHTML();
    initHome();
    return;
  }
  const r = TOOL_RENDERERS[hash];
  APP.innerHTML = navHTML() + r.html(tool) + footerHTML();
  r.init();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
