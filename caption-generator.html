<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generator Caption Instagram Gratis | ToolKita</title><meta name="description" content="Buat ide caption Instagram dan media sosial gratis untuk jualan, promosi, produk, dan konten dengan ToolKita."><link rel="canonical" href="https://juna07.github.io/toolkita/caption-generator.html"><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ef;color:#1b1f23}.nav{background:#153450;padding:18px 20px}.nav a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:800px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dad4c5;border-radius:10px;padding:24px}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}.btn{background:#ffb627;border:0;border-radius:6px;padding:12px 20px;font-weight:bold;cursor:pointer}.caption{background:#f0eee7;border-radius:8px;padding:16px;margin-top:14px;white-space:pre-wrap}</style></head><body><nav class="nav"><a href="./">← ToolKita</a></nav><main class="wrap"><h1>Generator Caption Gratis</h1><p>Buat beberapa ide caption untuk Instagram, TikTok, Facebook, atau promosi produk.</p><div class="box"><div class="field"><label>Topik / nama produk</label><input id="topic" placeholder="Contoh: Kopi susu gula aren"></div><div class="field"><label>Gaya caption</label><select id="style"><option value="jual">Jualan & promosi</option><option value="santai">Santai</option><option value="profesional">Profesional</option><option value="promo">Promo / diskon</option></select></div><button class="btn" id="go">Buat Caption</button><div id="out"></div></div><h2>Cara menggunakan</h2><p>Masukkan topik atau nama produk, pilih gaya caption, lalu klik tombol untuk mendapatkan beberapa ide yang bisa kamu edit sesuai kebutuhan.</p></main><script>const topic=document.getElementById('topic'),style=document.getElementById('style'),out=document.getElementById('out');document.getElementById('go').onclick=()=>{const t=topic.value.trim()||'produk kamu',s=style.value;let a=[];if(s==='jual')a=[`✨ Kenalan dengan ${t}! Pilihan praktis untuk kamu yang ingin kualitas dan rasa yang bikin balik lagi. Yuk coba hari ini!`,`Lagi cari ${t}? 😍 Saatnya cobain yang satu ini. Pesan sekarang dan rasakan sendiri!`,`Buat hari ini lebih spesial dengan ${t}. Jangan sampai kehabisan! 📩 Hubungi kami untuk pesan.`];else if(s==='santai')a=[`Hari ini mood-nya ${t} ☕✨ Kamu tim coba sekarang atau nanti?`,`Sedikit ${t}, banyak cerita. 😄 Siapa yang sudah coba?`,`Kalau ada ${t} di depan mata, susah bilang tidak. 🤭`];else if(s==='profesional')a=[`${t} hadir untuk membantu kebutuhan Anda dengan kualitas dan layanan yang kami prioritaskan. Hubungi kami untuk informasi lebih lanjut.`,`Temukan solusi yang tepat melalui ${t}. Praktis, berkualitas, dan siap digunakan.`,`Butuh ${t}? Kami siap membantu. Silakan hubungi kami untuk detail produk dan pemesanan.`];else a=[`🔥 PROMO ${t}! Jangan lewatkan kesempatan ini. Pesan sekarang sebelum promo berakhir!`,`Harga spesial untuk ${t} hari ini! 🎉 Stok terbatas, amankan pesananmu sekarang.`,`Mau hemat? Saatnya checkout ${t}. 💥 Promo terbatas!`];out.innerHTML=a.map(x=>`<div class="caption">${x}</div>`).join('')};</script></body></html>
