<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF ke JPG Online Gratis | ToolKita</title><meta name="description" content="Ubah halaman PDF menjadi gambar JPG secara gratis langsung dari browser."><link rel="canonical" href="https://juna07.github.io/toolkita/pdf-to-jpg.html"><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ef;color:#1b1f23}.nav{background:#153450;padding:18px 20px}.nav a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:850px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dad4c5;border-radius:10px;padding:24px}input[type=file]{width:100%;padding:12px 0}.btn{background:#ffb627;border:0;border-radius:6px;padding:12px 20px;font-weight:bold;cursor:pointer;margin-top:12px}.out{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}.item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;width:180px}.item canvas{max-width:100%;display:block}</style></head><body><nav class="nav"><a href="./">← ToolKita</a></nav><main class="wrap"><h1>PDF ke JPG Online Gratis</h1><p>Ubah setiap halaman PDF menjadi gambar JPG langsung dari browser.</p><div class="box"><input id="file" type="file" accept="application/pdf"><button class="btn" id="go">Konversi PDF ke JPG</button><p id="status"></p><div id="out" class="out"></div></div><h2>Cara menggunakan</h2><p>Pilih file PDF lalu klik konversi. Setiap halaman akan ditampilkan sebagai gambar JPG yang bisa disimpan.</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const file=document.getElementById('file'),out=document.getElementById('out'),status=document.getElementById('status');document.getElementById('go').onclick=async()=>{if(!file.files[0]){status.textContent='Pilih file PDF terlebih dahulu.';return}out.innerHTML='';status.textContent='Memproses...';const buf=await file.files[0].arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),vp=page.getViewport({scale:1.5}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const item=document.createElement('div');item.className='item';item.appendChild(canvas);const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',.92);a.download='halaman-'+n+'.jpg';a.textContent='Simpan JPG';item.appendChild(a);out.appendChild(item)}status.textContent=pdf.numPages+' halaman berhasil dikonversi.'}</script></body></html>
