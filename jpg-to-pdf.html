<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG ke PDF Online Gratis | ToolKita</title><meta name="description" content="Gabungkan gambar JPG atau PNG menjadi satu file PDF secara gratis langsung dari browser."><link rel="canonical" href="https://juna07.github.io/toolkita/jpg-to-pdf.html"><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ef;color:#1b1f23}.nav{background:#153450;padding:18px 20px}.nav a{color:#fff;text-decoration:none;font-weight:bold}.wrap{max-width:850px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dad4c5;border-radius:10px;padding:24px}input[type=file]{width:100%;padding:12px 0}.btn{background:#ffb627;border:0;border-radius:6px;padding:12px 20px;font-weight:bold;cursor:pointer;margin-top:12px}.preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.preview img{width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid #ddd}</style></head><body><nav class="nav"><a href="./">← ToolKita</a></nav><main class="wrap"><h1>JPG ke PDF Online Gratis</h1><p>Gabungkan beberapa gambar JPG atau PNG menjadi satu file PDF langsung di browser.</p><div class="box"><input id="files" type="file" accept="image/jpeg,image/png" multiple><div id="preview" class="preview"></div><button class="btn" id="make">Buat PDF</button><p id="status"></p></div><h2>Cara menggunakan</h2><p>Pilih satu atau beberapa gambar, lalu klik Buat PDF. File diproses di browser dan hasilnya dapat disimpan sebagai PDF.</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>const f=document.getElementById('files'),p=document.getElementById('preview'),s=document.getElementById('status');f.onchange=()=>{p.innerHTML='';[...f.files].forEach(x=>{const i=document.createElement('img');i.src=URL.createObjectURL(x);p.appendChild(i)})};document.getElementById('make').onclick=async()=>{if(!f.files.length){s.textContent='Pilih gambar terlebih dahulu.';return}const{jsPDF}=window.jspdf;const pdf=new jsPDF();for(let n=0;n<f.files.length;n++){if(n)pdf.addPage();const data=await new Promise(r=>{const a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f.files[n])});const im=new Image();await new Promise(r=>{im.onload=r;im.src=data});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=10,scale=Math.min((pw-2*m)/im.width,(ph-2*m)/im.height);pdf.addImage(data,'JPEG',m+(pw-2*m-im.width*scale)/2,m+(ph-2*m-im.height*scale)/2,im.width*scale,im.height*scale)}pdf.save('toolkita-jpg-to-pdf.pdf');s.textContent='PDF berhasil dibuat.'}</script></body></html>
